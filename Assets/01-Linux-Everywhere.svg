<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Günlük hayattaki modem, televizyon, telefon ve oyun konsolunun üzerinde küçük penguenler ve ortak bir Linux temelini gösteren düz vektör illüstrasyon.">
  <defs>
    <g id="penguen">
      <ellipse cx="-9" cy="-3" rx="7" ry="4" fill="#F2A33C"/>
      <ellipse cx="9" cy="-3" rx="7" ry="4" fill="#F2A33C"/>
      <ellipse cx="0" cy="-30" rx="20" ry="28" fill="#2E3440"/>
      <ellipse cx="0" cy="-24" rx="12" ry="20" fill="#F8FAFC"/>
      <polygon points="-6,-36 6,-36 0,-28" fill="#F2A33C"/>
      <circle cx="-6" cy="-44" r="3" fill="#FFFFFF"/>
      <circle cx="6" cy="-44" r="3" fill="#FFFFFF"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#F4F7FB"/>

  <!-- ortak temel cizgisi -->
  <line x1="150" y1="250" x2="1420" y2="250" stroke="#C6D8EA" stroke-width="4" stroke-linecap="round"/>

  <!-- yukselen devre izleri -->
  <g stroke="#A9C4DE" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M200 560 L200 250"/>
    <path d="M600 470 L600 250"/>
    <path d="M1000 500 L1000 250"/>
    <path d="M1365 586 L1365 250"/>

    <path d="M200 340 L240 300 L240 250"/>
    <path d="M600 360 L560 320 L560 250"/>
    <path d="M1000 330 L1040 290 L1040 250"/>
    <path d="M1365 380 L1325 340 L1325 250"/>
  </g>

  <!-- devre dugum noktalari -->
  <g fill="#A9C4DE">
    <circle cx="240" cy="300" r="4"/>
    <circle cx="560" cy="320" r="4"/>
    <circle cx="1040" cy="290" r="4"/>
    <circle cx="1325" cy="340" r="4"/>
  </g>

  <!-- ortak temel uzerindeki baglanti noktalari -->
  <g fill="#F4F7FB" stroke="#A9C4DE" stroke-width="3">
    <circle cx="200" cy="250" r="8"/>
    <circle cx="600" cy="250" r="8"/>
    <circle cx="1000" cy="250" r="8"/>
    <circle cx="1365" cy="250" r="8"/>
  </g>

  <!-- golgeler -->
  <g fill="#E3EAF3">
    <ellipse cx="200" cy="672" rx="105" ry="16"/>
    <ellipse cx="600" cy="672" rx="150" ry="16"/>
    <ellipse cx="1000" cy="672" rx="80" ry="16"/>
    <ellipse cx="1365" cy="672" rx="105" ry="16"/>
  </g>

  <!-- 1. modem / router -->
  <g>
    <line x1="150" y1="560" x2="138" y2="480" stroke="#A9C4DE" stroke-width="5" stroke-linecap="round"/>
    <line x1="250" y1="560" x2="262" y2="480" stroke="#A9C4DE" stroke-width="5" stroke-linecap="round"/>
    <circle cx="138" cy="480" r="6" fill="#7FB3D5"/>
    <circle cx="262" cy="480" r="6" fill="#7FB3D5"/>
    <rect x="120" y="560" width="160" height="90" rx="16" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="3"/>
    <circle cx="152" cy="628" r="5" fill="#7FB3D5"/>
    <circle cx="170" cy="628" r="5" fill="#A9DFBF"/>
    <circle cx="188" cy="628" r="5" fill="#F5B7B1"/>
  </g>

  <!-- 2. akilli televizyon -->
  <g>
    <rect x="470" y="470" width="260" height="150" rx="12" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="3"/>
    <rect x="486" y="486" width="228" height="118" rx="7" fill="#EAF2FB"/>
    <rect x="580" y="620" width="40" height="28" fill="#DCE6F2"/>
    <rect x="540" y="648" width="120" height="12" rx="6" fill="#DCE6F2"/>
    <circle cx="600" cy="545" r="14" fill="#C6D8EA" opacity="0.6"/>
  </g>

  <!-- 3. akilli telefon -->
  <g>
    <rect x="940" y="500" width="120" height="212" rx="20" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="3"/>
    <rect x="952" y="522" width="96" height="168" rx="12" fill="#FDF0F0"/>
    <circle cx="1000" cy="511" r="4" fill="#CBD8E8"/>
    <circle cx="1000" cy="600" r="12" fill="#F5B7B1" opacity="0.7"/>
  </g>

  <!-- 4. oyun konsolu -->
  <g>
    <rect x="1280" y="586" width="170" height="74" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="3"/>
    <circle cx="1322" cy="623" r="11" fill="#F5B7B1"/>
    <circle cx="1354" cy="623" r="11" fill="#7FB3D5"/>
    <rect x="1382" y="619" width="50" height="8" rx="4" fill="#DCE6F2"/>
  </g>

  <!-- cihazlarin uzerindeki kucuk penguenler -->
  <use href="#penguen" x="200" y="560"/>
  <use href="#penguen" x="600" y="470"/>
  <use href="#penguen" x="1000" y="500"/>
  <use href="#penguen" x="1365" y="586"/>
</svg>
