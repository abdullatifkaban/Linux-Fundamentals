      <circle cx="6" cy="-44" r="3" fill="#FFFFFF"/>
    </g>
  </defs>

  <rect width="1280" height="720" fill="#F4F7FB"/>

  <!-- kok -->
  <use href="#penguen" x="640" y="96"/>
  <rect x="560" y="96" width="160" height="78" rx="18" fill="#7FB3D5"/>

  <!-- dallar -->
