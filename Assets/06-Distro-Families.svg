  <rect x="565" y="322" width="150" height="64" rx="16" fill="#7FB3D5"/>
  <rect x="905" y="322" width="150" height="64" rx="16" fill="#A9DFBF"/>

  <!-- cocuk dugum baglantilari -->
  <g stroke="#DCE6F2" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M300 386 L300 410 L190 410 L190 470"/>
    <path d="M300 386 L300 410 L410 410 L410 470"/>
    <path d="M640 386 L640 410 L530 410 L530 470"/>
    <path d="M640 386 L640 410 L750 410 L750 470"/>
    <path d="M980 386 L980 410 L870 410 L870 470"/>
    <path d="M980 386 L980 410 L1090 410 L1090 470"/>
