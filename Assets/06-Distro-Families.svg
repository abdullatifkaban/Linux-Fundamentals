<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Linux dağıtımlarının Debian, Fedora ve Arch aileleri hâlinde dallandığını gösteren soyut ağaç illüstrasyonu.">
  <defs>
    <g id="penguen">
      <ellipse cx="-9" cy="-3" rx="7" ry="4" fill="#F2A33C"/>
      <ellipse cx="9" cy="-3" rx="7" ry="4" fill="#F2A33C"/>
      <ellipse cx="0" cy="-30" rx="20" ry="28" fill="#2E3440"/>
      <ellipse cx="0" cy="-24" rx="12" ry="20" fill="#F8FAFC"/>
